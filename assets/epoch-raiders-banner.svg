<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc">
  <title id="title">Epoch Raiders — Train. Tune. Conquer.</title>
  <desc id="desc">Retro arcade-inspired neon banner for an open-source Qwen3.5 fine-tuning laboratory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100C32"/><stop offset=".55" stop-color="#171044"/><stop offset="1" stop-color="#080C29"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73F4FF"/><stop offset=".48" stop-color="#8A8FFF"/><stop offset="1" stop-color="#FF65C1"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8AF7FF"/><stop offset="1" stop-color="#9A68FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6D75DC" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>
  <rect width="1280" height="410" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="410" rx="24" fill="url(#grid)"/>
  <circle cx="990" cy="210" r="170" fill="#5646DC" opacity=".21" filter="url(#soft)"/>
  <circle cx="1120" cy="115" r="95" fill="#F636B5" opacity=".17" filter="url(#soft)"/>
  <path d="M 0 355 L 1280 355" stroke="#746CF8" stroke-opacity=".3" stroke-width="2"/>
  <path d="M 26 94 L 26 32 L 98 32 M 1182 32 L 1252 32 L 1252 94 M 26 316 L 26 378 L 98 378 M 1182 378 L 1252 378 L 1252 316" fill="none" stroke="#78ECFF" stroke-opacity=".55" stroke-width="4"/>
  <g opacity=".85" fill="#B7ECFF">
    <rect x="815" y="64" width="7" height="7"/><rect x="1195" y="120" width="6" height="6"/><rect x="859" y="309" width="5" height="5"/>
    <rect x="1105" y="50" width="4" height="4"/><rect x="740" y="137" width="4" height="4"/>
  </g>
  <g transform="translate(70 62)">
    <rect width="246" height="38" rx="19" fill="#211A59" stroke="#6E82E9" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#64F5CA" filter="url(#glow)"/>
    <text x="40" y="25" font-size="17" letter-spacing="3" font-family="Arial,sans-serif" fill="#D8DDFF" font-weight="700">AI TRAINING LAB</text>
  </g>
  <text x="66" y="205" font-size="98" font-weight="900" font-family="Arial Black,Arial,sans-serif" letter-spacing="-2" fill="#F3F5FF">EPOCH</text>
  <text x="66" y="307" font-size="102" font-weight="900" font-family="Arial Black,Arial,sans-serif" letter-spacing="-2" fill="url(#neon)">RAIDERS</text>
  <text x="72" y="356" font-size="20" font-family="Arial,sans-serif" fill="#BEC8FF" letter-spacing="5">TRAIN  ·  TUNE  ·  CONQUER</text>
  <g transform="translate(967 201)">
    <circle r="130" fill="none" stroke="#7B75EA" stroke-width="2" stroke-dasharray="9 13" opacity=".55"/>
    <circle r="96" fill="none" stroke="#9B7BFF" stroke-width="2" opacity=".38"/>
    <path d="M0 -114 L20 -62 L61 -50 L98 1 L47 20 L32 67 L0 111 L-32 67 L-47 20 L-98 1 L-61 -50 L-20 -62Z" fill="#1B1D59" stroke="#6D78D9" stroke-width="7" stroke-linejoin="round"/>
    <path d="M0 -93 L16 -43 L51 -24 L66 2 L22 17 L0 74 L-22 17 L-66 2 L-51 -24 L-16 -43Z" fill="url(#ship)" stroke="#D9F7FF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 -57 L14 -16 L0 8 L-14 -16Z" fill="#F9A5F5"/>
    <path d="M-22 37 L-9 65 L0 94 L9 65 L22 37" fill="#FC56AB" opacity=".78" filter="url(#glow)"/>
    <circle cx="-105" cy="-45" r="10" fill="#FF58B5" opacity=".92"/>
    <circle cx="110" cy="60" r="8" fill="#77F1FF"/>
  </g>
  <g transform="translate(1055 332)">
    <rect width="154" height="31" rx="7" fill="#231953" stroke="#E06BAE" stroke-width="1"/>
    <text x="77" y="21" text-anchor="middle" font-size="14" letter-spacing="2" fill="#FFE2F3" font-family="Arial,sans-serif">QWEN3.5-4B</text>
  </g>
</svg>